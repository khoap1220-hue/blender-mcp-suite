[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-suite"
version = "1.0.0"
description = "21-tool Blender 4.1+ Model Context Protocol (MCP) server suite with Windows Job Object zero-zombie containment and auto-reconnect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khoa Phan", email = "khoap1220@gmail.com" }]
dependencies = ["mcp>=1.10,<2"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["blender_mcp*"]
